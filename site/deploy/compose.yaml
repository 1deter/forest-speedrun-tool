# forest.deter.cloud on the VPS: /opt/forest-site/compose.yaml (setup.sh
# puts it there). The stock ASP.NET image runs the release that deploy.sh
# unpacked; Caddy (its own compose project) reaches it by name on the
# shared network. No port is published on the host.
services:
  forest-site:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: forest-site
    restart: unless-stopped
    working_dir: /srv/current
    entrypoint: ["dotnet", "/srv/current/ForestSite.dll"]
    environment:
      ASPNETCORE_URLS: http://+:8080
      FOREST_DATA: /data
    env_file: .env            # FOREST_ADMIN_TOKEN
    volumes:
      - /opt/forest-site/app:/srv:ro
      - /var/lib/forest-site:/data
    networks:
      - caddy-navidrome

networks:
  caddy-navidrome:
    external: true
