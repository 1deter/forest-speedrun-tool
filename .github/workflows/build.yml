name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default: the build and tests never write to the repo. Only
# the release job (tags) gets contents: write (T-0480, REVIEW.md 7).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      # No game files are present in CI. The project falls back to BepInEx's
      # stubbed UnityEngine 5.6 package automatically when it can't find a
      # local install, so this builds clean on a bare runner.
      - name: Restore
        run: dotnet restore ForestOverlay.csproj

      - name: Build
        run: dotnet build ForestOverlay.csproj -c Release --no-restore

      # Tests cover the pure logic (run comparison, the recorder state
      # machine) by linking those sources against a tiny UnityEngine shim,
      # so they need no game files and no Unity.
      - name: Test
        run: dotnet test tests/ForestOverlay.Tests/ForestOverlay.Tests.csproj -c Release --nologo

      # The offline IL scanner (tools/ILScan) over a fixture assembly (T-0146).
      - name: ILScan tests
        run: dotnet test tests/ILScan.Tests/ILScan.Tests.csproj -c Release --nologo

      # The task file (docs/harness.md 6) against the rules, and docs/tasks.md
      # generated from it.
      - name: Tasks
        run: |
          python3 scripts/tasks.py check

      # Every scripts/tests/test_*.py, found by unittest - a new test file runs
      # in CI without being listed here (T-0147).
      - name: Script tests
        run: python3 -m unittest discover scripts/tests

      # The machine gates (docs/harness.md 5a, 5b, 7b): the lints over the
      # tree (WHAT / WHY / FIX on failure; with the log catalogue, 9a).
      - name: Lint
        run: |
          python3 scripts/lint.py

      - name: Upload plugin DLL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ForestOverlay-${{ github.sha }}
          path: bin/Release/net35/ForestOverlay.dll
          if-no-files-found: error

  # A tag publishes a release: its own job, the only one that may write,
  # from the DLL the build job made and tested.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The tag against the csproj, Plugin.PluginVersion and CHANGELOG.md
      # (the same check the pre-push hook runs; bump.py writes all three).
      - name: Tag check
        run: python3 scripts/lint.py --tag "$GITHUB_REF_NAME"

      - name: Download plugin DLL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ForestOverlay-${{ github.sha }}
          path: bin/Release/net35

      # The release's notes are the tag's section of CHANGELOG.md (from its
      # "## vX.Y.Z" heading to the next one). The plugin's Updates tab shows
      # them, so a tag without a section fails here rather than publishing
      # a release that says nothing.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if ($2 == tag) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          cat release-notes.md

      # Tagging a commit v0.4.0 (etc.) publishes a downloadable release,
      # so a working DLL is always one click away without building.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: bin/Release/net35/ForestOverlay.dll
          body_path: release-notes.md
