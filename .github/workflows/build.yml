name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # No game files are present in CI. The project falls back to BepInEx's
      # stubbed UnityEngine 5.6 package automatically when it can't find a
      # local install, so this builds clean on a bare runner.
      - name: Restore
        run: dotnet restore ForestOverlay.csproj

      - name: Build
        run: dotnet build ForestOverlay.csproj -c Release --no-restore

      # Tests cover the pure logic (run comparison, the recorder state
      # machine) by linking those sources against a tiny UnityEngine shim,
      # so they need no game files and no Unity.
      - name: Test
        run: dotnet test tests/ForestOverlay.Tests/ForestOverlay.Tests.csproj -c Release --nologo

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: ForestOverlay-${{ github.sha }}
          path: bin/Release/net35/ForestOverlay.dll
          if-no-files-found: error

      # The release's notes are the tag's section of CHANGELOG.md (from its
      # "## vX.Y.Z" heading to the next one). The plugin's Updates tab shows
      # them, so a tag without a section fails here rather than publishing
      # a release that says nothing.
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if ($2 == tag) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          cat release-notes.md

      # Tagging a commit v0.4.0 (etc.) publishes a downloadable release,
      # so a working DLL is always one click away without building.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net35/ForestOverlay.dll
          body_path: release-notes.md
