name: bot

# The game-knowledge Discord bot (docs/knowledge-bot.md): test (incl. the
# lint over knowledge/), publish for the VPS (arm64), ship over SSH to
# bot/deploy/deploy.sh (the bot's deploy key can run nothing else). Runs on
# knowledge changes too - the cards ship inside the release.

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'knowledge/**'
      - 'docs/game-notes.md'
      - 'docs/savestates.md'
      - 'docs/run-mode.md'
      - 'docs/fsm/**'
      - 'tools/BridgeMcp/DiscordText.cs'
      - '.github/workflows/bot.yml'
  pull_request:
    paths: ['bot/**', 'knowledge/**']
  # By hand: the eval only (job eval-manual) - never a build or a deploy
  # (T-0141, the bot-review skill). `all` = every question in
  # knowledge/eval/questions.md, or a space-separated list of ids.
  workflow_dispatch:
    inputs:
      eval_ids:
        description: 'Eval questions: "all" or space-separated ids'
        required: false
        default: 'all'
        type: string

jobs:
  bot:
    # A dispatch only evals (below): it must not test, publish or deploy.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # On the job, not the workflow: the eval job below must not hold it.
    concurrency:
      group: bot-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test bot/ForestBot.Tests -c Release --nologo

      - name: Publish (linux-arm64)
        run: |
          dotnet publish bot/ForestBot -c Release -r linux-arm64 --self-contained false -p:SourceRevisionId=${{ github.sha }} -o out
          test -f out/kb/knowledge/glossary.md
          tar czf bot.tgz -C out .
          ls -l bot.tgz

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.BOT_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$HOST_KEY" ]; then
            echo "::warning::Bot deploy secrets not set (bot/deploy/README.md) - built and tested only."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$HOST $HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes forestbotdeploy@"$HOST" < bot.tgz

  # A small eval subset on the live bot's key (author 2026-10-07: it
  # shares the free daily quota, so few questions, one cheap model).
  # Warn-only, in its own job and concurrency group: it never fails the
  # run and the next push's deploy never queues behind it (a newer push
  # cancels a running eval). Busy questions are skipped, not scored
  # (gotcha 94). No code tools or embedding model here, so it checks the
  # cards and the prompt. The subset includes two short-question items
  # (T-0090: short-bomb-fps with its expand follow-up, short-coyote); the
  # runner checks their max-length / min-length as facts, so a wall of
  # text for a 3-word question lowers the score. Both are card-only.
  eval:
    needs: bot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    concurrency:
      group: bot-eval
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Eval subset (warn-only)
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FOREST_BOT_MODELS: gemini:gemini-3.5-flash-lite
          EVAL_SUBSET: bomb-why fall-how zipline keycardless injection short-bomb-fps short-coyote
          WARN_BELOW: 70
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret not set (bot/deploy/README.md) - eval skipped."
            exit 0
          fi
          dotnet run --project bot/ForestBot -c Release -- eval $EVAL_SUBSET --summary "$GITHUB_STEP_SUMMARY" | tee eval.txt
          line=$(grep '^Score:' eval.txt || true)
          pct=$(echo "$line" | sed -n 's/^Score: [0-9]*\/[0-9]* = \([0-9.]*\)%.*/\1/p')
          answered=$(echo "$line" | sed -n 's/.*, \([0-9]*\) answered.*/\1/p')
          if [ -z "$pct" ]; then echo "::warning::Eval printed no score."; exit 0; fi
          if [ "${answered:-0}" = 0 ]; then echo "::warning::Eval: every question was busy (quota) - nothing scored."; exit 0; fi
          if awk -v p="$pct" -v w="$WARN_BELOW" 'BEGIN{exit !(p < w)}'; then
            echo "::warning::Eval subset scored $pct% (under $WARN_BELOW%) - $line"
          else
            # An annotation, not a log line: the run page shows it without sign-in.
            echo "::notice::Eval subset: $line"
          fi

  # The full eval by hand (T-0141): `gh workflow run bot.yml -f eval_ids=all`
  # (or ids). Same model and key as the subset, so it shares the free
  # quota - run it once per review, not in a loop. Never deploys: no
  # publish, no ssh. Prints one line per question and the score; busy
  # questions are skipped, not scored (gotcha 94). Warn-only like the subset.
  eval-manual:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    concurrency:
      group: bot-eval
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Eval (full set or the named ids)
        timeout-minutes: 80
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FOREST_BOT_MODELS: gemini:gemini-3.5-flash-lite
          EVAL_IDS: ${{ inputs.eval_ids }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret not set (bot/deploy/README.md) - eval skipped."
            exit 1
          fi
          ids="$EVAL_IDS"
          if [ "$ids" = "all" ]; then ids=""; fi
          if ! printf '%s' "$ids" | grep -Eq '^[A-Za-z0-9_ -]*$'; then
            echo "::error::eval_ids must be 'all' or space-separated question ids."
            exit 1
          fi
          # $ids unquoted on purpose: one argument per id.
          dotnet run --project bot/ForestBot -c Release -- eval $ids --summary "$GITHUB_STEP_SUMMARY" | tee eval.txt
          grep '^Score:' eval.txt || echo "::warning::Eval printed no score."
